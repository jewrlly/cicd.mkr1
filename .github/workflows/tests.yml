name: Tests and PEP8

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest test_main.py --html=report.html --self-contained-html

    - name: Check PEP8
      run: flake8 main.py test_main.py